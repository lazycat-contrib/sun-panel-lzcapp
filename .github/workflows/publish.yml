name: Publish Sun-Panel to MiaoMiao
on:
  schedule:
    - cron: '57 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '首次发布填 1.8.1；留空检查上游稳定版本'
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sun-panel-publish
  cancel-in-progress: false
jobs:
  publish:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      version: ${{ inputs.version || '' }}
      toolchains: none
      versioned-release-asset: true
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
